name: Midoku IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run collection core and simulator regression checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: midoku-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect collection changes
        id: collection_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          if [[ "$RUN_TESTS" == "true" ]] || { [[ "$EVENT_NAME" == "push" ]] && ! git diff --quiet HEAD^ HEAD -- Package.swift Midoku/Core/Collection Midoku/Features/Collection Tests/Collection MidokuTests/CollectionIntegrationTests.swift; }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test collection core
        if: steps.collection_changes.outputs.run == 'true'
        run: swift test
      - name: Test collection integration on simulator
        if: steps.collection_changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, items in devices.items() if "iOS-27" in runtime for d in items if "iPhone" in d["name"]))')
          xcodebuild -project Midoku.xcodeproj -scheme Midoku -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath build/TestDerivedData \
            -skipPackagePluginValidation -parallel-testing-enabled NO \
            -only-testing:MidokuTests/CollectionIntegrationTests \
            CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee collection-tests.log
      - name: Test SideStore publishing
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          version="0.9.${GITHUB_RUN_NUMBER}"
          xcodebuild -project Midoku.xcodeproj -scheme Midoku -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation COMPILER_INDEX_STORE_ENABLE=NO \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build.log
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package/Payload build/artifacts
          app=build/DerivedData/Build/Products/Release-iphoneos/Midoku.app
          test -s "$app/Midoku"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.raahat.Midoku
          ditto "$app" build/package/Payload/Midoku.app
          (cd build/package && zip -qry ../artifacts/Midoku-unsigned.ipa Payload)
          unzip -t build/artifacts/Midoku-unsigned.ipa
          (cd build/artifacts && shasum -a 256 Midoku-unsigned.ipa > SHA256SUMS.txt)
          printf 'Commit: %s\nUnsigned iOS device build for SideStore or LiveContainer.\n' "$GITHUB_SHA" > build/artifacts/BUILD.txt
      - name: Publish release and SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_sidestore.py build/artifacts/Midoku-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Midoku-unsigned-${{ github.sha }}
          path: build/artifacts/
          if-no-files-found: error
