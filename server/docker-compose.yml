# Reachable only inside your Tailscale network (no public ports). Setup: server/README.md
# Neutral names so it doesn't stand out in `docker ps` on a shared machine.
name: ${STACK_NAME:-cache}
services:
  net:
    container_name: ${STACK_NAME:-cache}-net
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-node}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME:-node}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./data/n:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  app:
    container_name: ${STACK_NAME:-cache}-app
    image: ${APP_IMAGE:-ghcr.io/suwayomi/suwayomi-server:stable}
    network_mode: service:net
    depends_on: [net]
    environment:
      TZ: ${TZ:-Etc/UTC}
      BIND_IP: 127.0.0.1
      BIND_PORT: "4567"
      AUTH_MODE: basic_auth
      AUTH_USERNAME: ${SUWAYOMI_USER}
      AUTH_PASSWORD: ${SUWAYOMI_PASSWORD}
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://127.0.0.1:8191
      EXTENSION_STORES: ${EXTENSION_STORES:-[]}
      WEB_UI_ENABLED: ${WEB_UI_ENABLED:-true}
      DEBUG: "false"
      MAX_LOG_FILES: "3"
      # Optional: send source traffic through a SOCKS proxy so sites never see this server's IP.
      SOCKS_PROXY_ENABLED: ${SOCKS_PROXY_ENABLED:-false}
      SOCKS_PROXY_HOST: ${SOCKS_PROXY_HOST:-}
      SOCKS_PROXY_PORT: ${SOCKS_PROXY_PORT:-}
      SOCKS_PROXY_USERNAME: ${SOCKS_PROXY_USERNAME:-}
      SOCKS_PROXY_PASSWORD: ${SOCKS_PROXY_PASSWORD:-}
    volumes:
      - ./data/a:/home/suwayomi/.local/share/Tachidesk
    restart: unless-stopped

  helper:
    container_name: ${STACK_NAME:-cache}-helper
    image: ${HELPER_IMAGE:-ghcr.io/flaresolverr/flaresolverr:latest}
    network_mode: service:net
    depends_on: [net]
    environment:
      HOST: 127.0.0.1
      LOG_LEVEL: warning
    restart: unless-stopped
